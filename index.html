<base target="_top">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; color: #1f1f1f; }
  body { font-family: -apple-system, "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 24px 16px 40px; }
  header { text-align: center; }
  .logo { width: 170px; height: auto; display: block; margin: 0 auto 18px; }
  h1 { font-size: 22px; margin: 4px 0 8px; }
  .intro { font-size: 15px; line-height: 1.8; color: #444; max-width: 620px; margin: 0 auto 20px; }
  .test { display: inline-block; background: #fff3e0; color: #b45309; border: 1px solid #f5c27a; border-radius: 6px; padding: 2px 10px; font-size: 13px; margin-bottom: 12px; }
  .test[hidden] { display: none; }
  .counter { position: sticky; top: 0; z-index: 2; background: #fff; text-align: center; padding: 8px 0; font-size: 14px; color: #555; border-bottom: 1px solid #eee; }
  .counter b { color: #000; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; margin-top: 16px; }
  .card { display: flex; flex-direction: column; border: 1px solid #e6e6e6; border-radius: 10px; overflow: hidden; cursor: pointer; background: #fff; }
  .card.on { border-color: #111; box-shadow: 0 0 0 1px #111; }
  .card img { width: 100%; aspect-ratio: 3 / 4; object-fit: contain; background: #fff; display: block; }
  .row { display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
  .row span { flex: 1; font-size: 13px; font-weight: 600; direction: ltr; text-align: right; word-break: break-word; }
  .row input { width: 20px; height: 20px; margin: 0; accent-color: #111; flex: none; }
  .actions { text-align: center; margin-top: 28px; }
  button { font: inherit; font-size: 17px; font-weight: 600; background: #111; color: #fff; border: 0; border-radius: 10px; padding: 14px 40px; cursor: pointer; min-width: 240px; }
  button:disabled { background: #888; cursor: default; }
  .msg { margin-top: 14px; font-size: 15px; line-height: 1.7; }
  .msg.ok { color: #1e7b34; }
  .msg.err { color: #b3261e; }
  @media (max-width: 480px) { .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; } h1 { font-size: 20px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img class="logo" id="logo" alt="قيدوم">
    <div class="test" id="testTag" hidden>وضع الاختبار — لا تُحتسب ضمن نتيجة العميلة</div>

  </header>
  <div class="counter">المنتجات المحددة: <b id="count">0</b> من <span id="total">0</span></div>
  <div class="grid" id="grid"></div>
  <div class="actions">
    <button id="send" type="button">إرسال الاختيارات</button>
    <div class="msg" id="msg" role="status"></div>
  </div>
</div>

  var MODE = new URLSearchParams(location.search).get('mode') === 'test' ? 'test' : 'real';
  var API = 'https://script.google.com/macros/s/AKfycbzSZnp7W-08E9rYPmeu9dwxEiCv5gip5xRnc5KdwWG9cYIitBFoEWoGMM4jO9Wpwqhm/exec';
  var submissionId = (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
  var grid = document.getElementById('grid'), countEl = document.getElementById('count');
  var btn = document.getElementById('send'), msg = document.getElementById('msg');
  var sending = false, done = false;

  document.getElementById('logo').src = DATA.logo;
  document.getElementById('total').textContent = DATA.products.length;
  if (MODE === 'test') document.getElementById('testTag').hidden = false;

  DATA.products.forEach(function (p) {
    var label = document.createElement('label');
    label.className = 'card';
    var img = document.createElement('img');
    img.loading = 'lazy'; img.decoding = 'async'; img.alt = p.name; img.src = p.img;
    var row = document.createElement('div'); row.className = 'row';
    var name = document.createElement('span'); name.textContent = p.name;
    var cb = document.createElement('input'); cb.type = 'checkbox'; cb.value = p.id;
    cb.addEventListener('change', function () { label.classList.toggle('on', cb.checked); updateCount(); });
    row.appendChild(cb); row.appendChild(name);
    label.appendChild(img); label.appendChild(row);
    grid.appendChild(label);
  });

  function selectedIds() {
    return Array.prototype.map.call(grid.querySelectorAll('input:checked'), function (c) { return c.value; });
  }
  function updateCount() { countEl.textContent = selectedIds().length; }

  btn.addEventListener('click', function () {
    if (sending || done) return;
    var ids = selectedIds();
    if (!ids.length && !confirm('لم يتم تحديد أي منتج. هل تريدين الإرسال على أي حال؟')) return;
    sending = true; btn.disabled = true; btn.textContent = 'جارٍ الحفظ…';
    msg.className = 'msg'; msg.textContent = '';
    send({ submissionId: submissionId, selected: ids, mode: MODE }, function (res) {
        sending = false;
        if (!res || !res.ok) return fail();
        done = true;
        btn.textContent = 'تم الإرسال';
        grid.querySelectorAll('input').forEach(function (c) { c.disabled = true; });
        msg.className = 'msg ok';
        msg.textContent = 'تم حفظ اختياراتك بنجاح — ' + res.selected + ' من ' + res.total + ' منتج. شكرًا لك.';
      }, fail);
  });

  // no Google cookies are sent (credentials: 'omit'), so signed-in phones are never routed to /u/N/
  function send(payload, onOk, onErr) {
    var ctl = window.AbortController ? new AbortController() : null;
    var timer = ctl && setTimeout(function () { ctl.abort(); }, 60000);
    fetch(API, { method: 'POST', credentials: 'omit', redirect: 'follow', signal: ctl && ctl.signal,
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(Object.assign({ action: 'submit' }, payload)) })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (res) { clearTimeout(timer); onOk(res); })
      .catch(function () { clearTimeout(timer); onErr(); });
  }

  function fail() {
    sending = false; btn.disabled = false; btn.textContent = 'إرسال الاختيارات';
    msg.className = 'msg err';
    msg.textContent = 'تعذّر حفظ الاختيارات. يرجى المحاولة مرة أخرى.';
  }
